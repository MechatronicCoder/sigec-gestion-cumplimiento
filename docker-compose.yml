services:
  nginx:
    image: nginx:stable-alpine
    container_name: sigecv2_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sigecv2

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigecv2_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    networks:
      - sigecv2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigecv2_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - sigecv2

  mysql:
    image: mysql:8.4
    container_name: sigecv2_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: sigecv2
      MYSQL_USER: sigec_user
      MYSQL_PASSWORD: sigec_password_change_me
    ports:
      - "3308:3306"
    volumes:
      - sigecv2_mysql_data:/var/lib/mysql
    networks:
      - sigecv2

  adminer:
    image: adminer
    container_name: sigecv2_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - sigecv2

volumes:
  sigecv2_mysql_data:
  frontend_node_modules:

networks:
  sigecv2:
    driver: bridge
