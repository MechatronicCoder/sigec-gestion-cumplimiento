# Integración continua de SIGEC.
# Corre en cada pull request y en cada push a develop y main:
#   - Backend: estilo con Pint y pruebas con PHPUnit contra MySQL (base sigec_test).
#   - Frontend: lint con oxlint y build de producción con Vite.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pint + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sigec_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, zip, intl, bcmath, exif
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Pruebas (PHPUnit con MySQL)
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sigec_test
          DB_USERNAME: root
          DB_PASSWORD: ""

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build de producción
        run: npm run build
